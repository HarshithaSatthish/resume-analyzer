# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo in Render Dashboard → New → Blueprint

services:
  - type: web
    name: resume-analyzer-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: resume_analyzer
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: CORS_ORIGINS
        value: https://resume-analyzer-three-tau.vercel.app
      - key: UPLOAD_DIR
        value: uploads
      - key: REPORTS_DIR
        value: reports
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
